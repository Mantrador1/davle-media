<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAVLE Watch Faces</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../brand/favicon_32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../brand/favicon_192.png">
<link rel="apple-touch-icon" href="../../brand/apple_touch_180.png">
<meta name="description" content="DAVLE watch faces for Wear OS — on Google Play.">
<style>
  :root { --bg:#0d0f12; --card:#16191e; --ink:#eef0f2; --mute:#9aa3ad; --line:#2a2f36; --accent:#3d8bfd; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:520px; margin:0 auto; padding:28px 16px 48px; }
  .brand { display:block; width:112px; height:112px; margin:4px auto 10px; border-radius:50%; }
  h1 { font-size:22px; text-align:center; margin:0 0 22px; font-weight:600; }
  .face { display:block; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden;
          text-decoration:none; color:inherit; margin:0 0 18px; }
  .face img { width:100%; aspect-ratio:4/5; object-fit:cover; display:block; background:#000; }
  .meta { padding:14px 16px 16px; }
  .name { font-size:19px; font-weight:600; letter-spacing:.04em; }
  .sub { color:var(--mute); font-size:14px; margin:2px 0 12px; }
  .btn { display:block; text-align:center; background:var(--accent); color:#fff; border-radius:10px; padding:12px; font-weight:600; }
  footer { color:var(--mute); font-size:12px; text-align:center; margin-top:26px; }
</style>
</head>
<body>
<main>
  <img class="brand" src="../../brand/logo_320.png" alt="DAVLE Watch Faces">
  <h1>Watch faces for Wear OS</h1>

  <a class="face" href="https://play.google.com/store/apps/details?id=com.davle.kyanos&amp;referrer=utm_source%3Dfacebook_groups%26utm_campaign%3Dkyanos">
    <img src="../../kyanos_k11/ig_01.jpg" alt="DAVLE KYANOS watch face on a Galaxy Watch Ultra">
    <div class="meta">
      <div class="name">KYANOS</div>
      <div class="sub">Hybrid analog + LCD · 6 accent colors · always-on display</div>
      <span class="btn">Get it on Google Play</span>
    </div>
  </a>

  <a class="face" href="https://play.google.com/store/apps/details?id=com.davle.atraktos&amp;referrer=utm_source%3Dfacebook_groups%26utm_campaign%3Datraktos">
    <img src="../../atraktos_k11/ig_01.jpg" alt="DAVLE ATRAKTOS watch face on a Galaxy Watch Ultra">
    <div class="meta">
      <div class="name">ATRAKTOS</div>
      <div class="sub">Flip clock + live gauges · 6 accent colors · always-on display</div>
      <span class="btn">Get it on Google Play</span>
    </div>
  </a>

  <footer>DAVLE studio · For Wear OS 5 or later</footer>
</main>
</body>
</html>
